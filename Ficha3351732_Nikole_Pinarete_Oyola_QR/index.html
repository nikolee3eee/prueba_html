<!DOCTYPE html>  <!-- Declara que el documento usa HTML5. -->
<html lang="es">  <!-- Elemento raíz; lang="es" indica el idioma. -->
<head>  <!-- Abre la cabecera con la información del documento. -->
<meta charset="UTF-8">  <!-- Codificación UTF-8 para ver bien tildes y la ñ. -->
<meta name="viewport" content="width=device-width, initial-scale=1">  <!-- Hace que la página use el ancho real del celular. Sin esto el QR se vería diminuto al escanearlo. -->
<title>Mi proyecto con QR</title>  <!-- Título de la pestaña del navegador. -->
<link rel="stylesheet" href="estilos.css">  <!-- Enlaza el CSS de la fase 2. La ruta es relativa: el archivo debe estar junto a index.html. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>  <!-- Carga la librería qrcode.js desde internet. Ella dibuja el QR; nosotros solo le decimos qué enlace codificar. -->
</head>  <!-- Cierra la cabecera. -->
<body>  <!-- Abre el cuerpo: lo que el usuario ve. -->
<header><h1>Mi proyecto web</h1><p>Escanea el QR desde tu celular</p></header>  <!-- Encabezado con el título principal y una instrucción corta. -->
<main>  <!-- Abre el contenido principal. -->
<section class="tarjeta">  <!-- Tarjeta que agrupa el QR y sus textos; la clase tarjeta le dará estilo. -->
<h2>Visita esta página en tu celular</h2>  <!-- Subtítulo de la tarjeta. -->
<div id="qrcode"></div>  <!-- Contenedor vacío. JavaScript dibujará aquí el QR; por eso necesita un id. -->
<p id="enlace">Generando QR...</p>  <!-- Párrafo donde JavaScript mostrará el enlace en texto. -->
<button id="copiarBtn">Copiar enlace</button>  <!-- Botón que copiará el enlace al portapapeles. -->
<p id="aviso"></p>  <!-- Párrafo vacío para confirmar que el enlace se copió. -->
</section>  <!-- Cierra la tarjeta. -->
</main>  <!-- Cierra el contenido principal. -->
<footer><small>SENA - ADSO - Ficha 3351732</small></footer>  <!-- Pie de página con tu ficha. -->
<script src="app.js"></script>  <!-- Enlaza el JavaScript de la fase 3, al final del body para que el HTML ya exista cuando se ejecute. -->
</body></html>  <!-- Cierra el cuerpo y el documento. -->
